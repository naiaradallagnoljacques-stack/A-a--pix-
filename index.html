<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Beats Açaí - Final com Confete</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Inter,Arial,sans-serif}
body{background:#0a0414;color:#fff;padding-bottom:110px;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at top,#7c1cf6 0%,transparent 60%),radial-gradient(ellipse at bottom,#ff00e5 0%,transparent 50%),#0a0414;z-index:-1}
.header{text-align:center;padding:25px 15px 10px}
.logo{width:80px;height:80px;margin:0 auto 12px;border:2px solid #b24bff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:36px;background:rgba(124,28,246,.2);box-shadow:0 0 20px #7c1cf6}
.header h1{font-size:32px;letter-spacing:6px;color:#e9c6ff;font-weight:200}
.badge{display:inline-block;background:rgba(255,255,255,.08);border:1px solid rgba(178,75,255,.3);border-radius:20px;padding:4px 10px;font-size:11px;margin:3px}
.fretegratis{background:linear-gradient(90deg,#7c1cf6,#ff00e5);border-radius:12px;padding:8px;text-align:center;font-size:12px;font-weight:700;margin:10px 16px}
.container{max-width:500px;margin:0 auto;padding:0 14px}
.card{background:rgba(255,255,255,.06);backdrop-filter:blur(12px);border:1px solid rgba(178,75,255,.25);border-radius:18px;padding:16px;margin-bottom:12px}
.card h2{font-size:12px;letter-spacing:2px;color:#d8b4fe;margin-bottom:12px}
.sizes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.size{border:1px solid rgba(255,255,255,.15);border-radius:14px;padding:14px;text-align:center;cursor:pointer;background:rgba(0,0,0,.35);color:#fff}
.size.on{border-color:#b24bff;background:linear-gradient(135deg,rgba(178,75,255,.35),rgba(124,28,246,.35));box-shadow:0 0 15px rgba(178,75,255,.4)}
.toppings{display:flex;flex-wrap:wrap;gap:7px}
.top{border:1px solid rgba(255,255,255,.15);border-radius:20px;padding:7px 13px;font-size:12px;cursor:pointer;background:rgba(0,0,0,.35);color:#ddd}
.top.on{background:linear-gradient(90deg,#7c1cf6,#b24bff);color:#fff}
.up-item{display:flex;justify-content:space-between;align-items:center;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.up-item.on{border-color:#facc15;background:rgba(250,204,21,.15)}
input{width:100%;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:13px;color:#fff;margin-top:8px;outline:none}
.foot{position:fixed;bottom:0;left:0;right:0;background:rgba(10,4,20,.96);border-top:1px solid rgba(178,75,255,.4);padding:12px 14px;display:flex;gap:10px;z-index:999}
.btn{flex:1;border:none;border-radius:14px;padding:15px;font-weight:800;cursor:pointer;font-size:14px}
#btnPix{background:#fff;color:#000}
#btnZap{background:linear-gradient(135deg,#7c1cf6,#ff00e5);color:#fff}
.total{text-align:center;margin:14px 0;color:#e9c6ff;font-weight:800;font-size:16px}
.pix-box{background:rgba(178,75,255,.12);border:1px dashed #b24bff;border-radius:12px;padding:12px;text-align:center}

/* ANIMAÇÃO PULSANDO + CONFETE */

#btnZap{animation:pulse 1.8s infinite}
.size.on{animation:pulse 2s infinite}
.confetti{position:fixed;top:-10px;width:8px;height:14px;z-index:9999;pointer-events:none;animation:fall linear forwards}
