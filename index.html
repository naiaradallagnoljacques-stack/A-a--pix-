<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Beats Açaí</title>
<style>
body{margin:0;background:#0a0414;color:#fff;font-family:Arial;padding-bottom:100px}
.header{text-align:center;padding:15px;background:#111}
.container{padding:10px;max-width:500px;margin:auto}
.card{background:#1a1a1a;border:1px solid #333;border-radius:12px;padding:12px;margin-bottom:10px}
.size{display:inline-block;width:48%;border:1px solid #555;border-radius:10px;padding:12px;text-align:center;margin:1%;background:#222;color:#fff}
.size.on{border-color:#b24bff;background:#2a1845}
.top{display:inline-block;border:1px solid #555;border-radius:20px;padding:6px 12px;margin:4px;font-size:12px;background:#222;color:#fff}
.top.on{background:#b24bff}
input{width:100%;padding:12px;margin-top:8px;border-radius:8px;border:1px solid #444;background:#222;color:#fff;box-sizing:border-box}
.foot{position:fixed;bottom:0;left:0;right:0;background:#000;padding:10px;display:flex;gap:8px;border-top:2px solid #b24bff}
.foot button{flex:1;padding:14px;border:none;border-radius:10px;font-weight:bold;font-size:14px}
#btnPix{background:#fff;color:#000}
#btnZap{background:#7c1cf6;color:#fff}
/* ANIMAÇÃO QUE NÃO QUEBRA */
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.05)}100%{transform:scale(1)}}
#btnZap{animation:pulse 1.5s infinite}
.confetti{position:fixed;top:0;width:8px;height:8px;pointer-events:none;z-index:9999}
</style>
</head>
<body>
<div class="header"><h1>🍧 THE BEATS AÇAÍ</h1><p>⭐ 4.9 | 🔥 127 hoje | 🟢 Aberto</p></div>

<div class="container">
<div class="card"><b>TAMANHO</b><br><br>
<button type="button" class="size on" id="s300" onclick="tam('300ml',14,'s300')">300ml<br>R$14</button>
<button type="button" class="size" id="s500" onclick="tam('500ml',20,'s500')">500ml<br>R$20</button>
<button type="button" class="size" id="s700" onclick="tam('700ml',26,'s700')">700ml<br>R$26</button>
<button type="button" class="size" id="s1L" onclick="tam('1L',34,'s1L')">1L<br>R$34</button>
</div>

<div class="card"><b>ADICIONAIS GRÁTIS (5)</b><br><br>
<span class="top" onclick="addTop(this)">Leite Condensado</span>
<span class="top" onclick="addTop(this)">Paçoca</span>
<span class="top" onclick="addTop(this)">Granola</span>
<span class="top" onclick="addTop(this)">Banana</span>
<span class="top" onclick="addTop(this)">Morango</span>
<span class="top" onclick="addTop(this)">Nutella</span>
<span class="top" onclick="addTop(this)">Leite Ninho</span>
<span class="top" onclick="addTop(this)">Confete</span>
<div id="cont" style="margin-top:8px;font-size:11px;color:#aaa">0/5</div>
</div>

<div class="card"><b>SEUS DADOS</b>
<input id="nome" placeholder="Seu nome">
<input id="end" placeholder="Endereço completo">
<input id="tel" placeholder="WhatsApp">
</div>

<div class="card" style="text-align:center"><b id="total">Total: R$ 14,00</b><br><br>PIX: <b>99292670000</b></div>
</div>

<div class="foot">
<button type="button" id="btnPix" onclick="copiaPix()">COPIAR PIX</button>
<button type="button" id="btnZap" onclick="mandaZap()">ENVIAR NO ZAP</button>
</div>

<script>
var tamanho='300ml'; var preco=14; var lista=[];
function tam(t,p,id){
  tamanho=t; preco=p;
  document.getElementById('s300').className='size';
  document.getElementById('s500').className='size';
  document.getElementById('s700').className='size';
  document.getElementById('s1L').className='size';
  document.getElementById(id).className='size on';
  document.getElementById('total').innerText='Total: R$ '+preco+',00';
  confete();
}
function addTop(el){
  if(el.className=='top on'){el.className='top'; lista=lista.filter(function(x){return x!=el.innerText});}
  else{if(lista.length>=5){alert('Máximo 5!');return} el.className='top on'; lista.push(el.innerText); confete();}
  document.getElementById('cont').innerText=lista.length+'/5';
}
function copiaPix(){
  var chave='99292670000';
  var a=document.createElement('input'); a.value=chave; document.body.appendChild(a); a.select(); document.execCommand('copy'); document.body.removeChild(a);
  alert('PIX COPIADO: '+chave); confete();
}
function mandaZap(){
  var n=document.getElementById('nome').value;
  var e=document.getElementById('end').value;
  if(n==''){alert('Digite nome');return}
  if(e==''){alert('Digite endereço');return}
  confete();
  setTimeout(function(){
    var msg='PEDIDO THE BEATS%0ANome: '+n+'%0ATamanho: '+tamanho+'%0AAdicionais: '+lista.join(', ')+'%0AEnd: '+e;
    window.location.href='https://wa.me/55991600621?text='+msg;
  },400);
}
function confete(){
  for(var i=0;i<12;i++){
    var c=document.createElement('div'); c.className='confetti';
    c.style.left=Math.random()*100+'%'; c.style.top='-10px';
    c.style.background=['#7c1cf6','#ff00e5','#facc15','#fff'][Math.floor(Math.random()*4)];
    c.style.width='8px'; c.style.height='12px';
    document.body.appendChild(c);
    var anim=c.animate([{transform:'translateY(0) rotate(0deg)',opacity:1},{transform:'translateY(100vh) rotate(720deg)',opacity:0}],{duration:2000+Math.random()*1000});
    anim.onfinish=function(){this.effect.target.remove()};
  }
}
</script>
</body>
</html>
