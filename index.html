<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Beats Açaí</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:sans-serif}
body{background:#0a0414;color:#fff;padding-bottom:180px}
.header{text-align:center;padding:20px}
.logo{width:80px;height:80px;margin:0 auto 10px;border:2px solid #b24bff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:36px}
.badge{display:inline-block;background:rgba(255,255,255,.1);border:1px solid #b24bff;border-radius:20px;padding:4px 10px;font-size:11px;margin:2px}
.fretegratis{background:linear-gradient(90deg,#7c1cf6,#ff00e5);text-align:center;padding:8px;font-size:12px;font-weight:700}
.fidelidade{text-align:center;padding:10px;margin:10px;border:2px dashed #facc15;border-radius:12px}
.dot{display:inline-flex;width:26px;height:26px;border-radius:50%;border:1px solid #facc15;align-items:center;justify-content:center;margin:2px;font-size:11px}
.dot.active{background:#facc15;color:#000}
.container{max-width:500px;margin:0 auto;padding:0 12px}
.card{background:rgba(255,255,255,.06);border:1px solid rgba(178,75,255,.3);border-radius:16px;padding:14px;margin-bottom:10px}
.sizes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.size{border:1px solid #444;border-radius:10px;padding:12px;text-align:center;cursor:pointer;background:#111}
.size.selected{border-color:#b24bff;background:rgba(178,75,255,.3)}
.toppings{display:flex;flex-wrap:wrap;gap:6px}
.top{border:1px solid #444;border-radius:20px;padding:6px 12px;font-size:12px;cursor:pointer;background:#111}
.top.active{background:#b24bff}
.up-item{display:flex;justify-content:space-between;background:#111;border:1px solid #444;border-radius:10px;padding:8px 10px;margin-bottom:6px;cursor:pointer}
.up-item.selected{border-color:#facc15;background:rgba(250,204,21,.2)}
input{width:100%;background:#111;border:1px solid #444;border-radius:10px;padding:12px;color:#fff;margin-top:8px}
.foot{position:fixed;bottom:0;left:0;right:0;background:#000;border-top:2px solid #b24bff;padding:10px;display:flex;gap:8px;z-index:999}
.btn{flex:1;border:none;border-radius:10px;padding:14px;font-weight:800;cursor:pointer;font-size:14px}
.btn-pix{background:#fff;color:#000}
.btn-zap{background:linear-gradient(90deg,#7c1cf6,#b24bff);color:#fff}
.total{text-align:center;margin:10px;color:#d8b4fe;font-weight:700}
.pix-box{border:1px dashed #b24bff;border-radius:10px;padding:10px;text-align:center}
.toast{position:fixed;bottom:80px;left:10px;right:10px;background:#222;border:1px solid #b24bff;border-radius:10px;padding:10px;text-align:center;display:none;z-index:1000}
.toast.show{display:block}
</style>
</head>
<body>
<div class="header"><div class="logo">🍧</div><h1>THE BEATS AÇAÍ</h1>
