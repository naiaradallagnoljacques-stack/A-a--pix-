<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Açaí do Ponto • Pedido</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Inter,Segoe UI,sans-serif}
body{background:#0a0414;color:#fff;padding-bottom:120px;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 20% 0%,#7c1cf6 0%,transparent 50%),radial-gradient(ellipse at 80% 100%,#ff00e5 0%,transparent 40%),#0a0414;z-index:-1}
.header{text-align:center;padding:35px 15px 20px}
.logo{width:90px;height:90px;margin:0 auto 15px;border:2px solid #b24bff;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 0 25px #7c1cf6;font-size:40px;background:rgba(124,28,246,.15)}
.header h1{font-size:38px;letter-spacing:8px;font-weight:200;text-shadow:0 0 15px #b24bff;color:#e9c6ff}
.header p{color:#a78bfa;letter-spacing:3px;font-size:12px;margin-top:8px}
.container{max-width:500px;margin:0 auto;padding:0 16px}
.card{background:rgba(255,255,255,.06);backdrop-filter:blur(15px);border:1px solid rgba(178,75,255,.25);border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:0 8px 30px rgba(0,0,0,.4)}
.card h2{font-size:13px;letter-spacing:2px;color:#d8b4fe;margin-bottom:12px}
.sizes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.size{border:1px solid rgba(255,255,255,.15);border-radius:14px;padding:14px;text-align:center;cursor:pointer;transition:.2s;background:rgba(0,0,0,.3)}
.size.selected{border-color:#b24bff;background:rgba(178,75,255,.2);box-shadow:0 0 15px rgba(178,75,255,.4)}
.size b{display:block;font-size:18px}
.size span{font-size:12px;color:#a78bfa}
.toppings{display:flex;flex-wrap:wrap;gap:8px}
.top{background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:7px 14px;font-size:13px;cursor:pointer;transition:.2s;color:#ddd}
.top.active{background:#b24bff;border-color:#b24bff;color:#fff;box-shadow:0 0 10px #b24bff}
input,textarea{width:100%;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:12px;color:#fff;margin-top:8px;outline:none}
input:focus,textarea:focus{border-color:#b24bff}
.foot{position:fixed;bottom:0;left:0;right:0;background:rgba(10,4,20,.9);backdrop-filter:blur(20px);border-top:1px solid rgba(178,75,255,.3);padding:12px 16px;display:flex;gap:10px;z-index:10}
.btn{flex:1;border:none;border-radius:12px;padding:14px;font-weight:700;cursor:pointer}
.btn-pix{background:#fff;color:#000}
.btn-zap{background:linear-gradient(135deg,#7c1cf6,#b24bff);color:#fff;box-shadow:0 0 15px #7c1cf6}
.total{text-align:center;margin:10px 0 5px;color:#d8b4fe;font-weight:600}
.pix-box{background:rgba(178,75,255,.1);border:1px dashed #b24bff;border-radius:12px;padding:12px;text-align:center;margin-top:12px}
.pix-box b{font-size:18px;letter-spacing:1px}
</style>
</head>
<body>
<div class="header">
<div class="logo">🍧</div>
<h1>AÇAÍ</h1>
<p>BOWLS • SMOOTHIES • GOOD</p>
</div>

<div class="container">
<div class="card"><h2>TAMANHO</h2>
<div class="sizes" id="sizes">
<div class="size selected" data-v="300" data-p="14"><b>300ml</b><span>R$ 14,00</span></div>
<div class="size" data-v="500" data-p="20"><b>500ml</b><span>R$ 20,00</span></div>
<div class="size" data-v="700" data-p="26"><b>700ml</b><span>R$ 26,00</span></div>
<div class="size" data-v="1000" data-p="34"><b>1 Litro</b><span>R$ 34,00</span></div>
</div></div>

<div class="card"><h2>ADICIONAIS GRÁTIS (5)</h2>
<div class="toppings" id="tops">
<span class="top">Leite Condensado</span><span class="top">Paçoca</span><span class="top">Granola</span><span class="top">Banana</span><span class="top">Morango</span><span class="top">Nutella</span><span class="top">Leite Ninho</span><span class="top">Confete</span>
</div></div>

<div class="card"><h2>SEUS DADOS</h2>
<input id="nome" placeholder="Seu nome">
<input id="end" placeholder="Endereço + bairro">
<input id="tel" placeholder="WhatsApp">
</div>

<div class="total" id="total">Total: R$ 14,00</div>
